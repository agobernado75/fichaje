<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo</title>
    <script>
      const ruta = location.pathname
      const destino = ruta && ruta !== '404.html' ? ruta : '/'
      location.replace(destino)
    </script>
  </head>
  <body>
    <a href="/">Ir a la aplicación</a>
  </body>
</html>
