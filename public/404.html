<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo</title>
    <script>
      const base = '/fichaje/'
      const ruta = location.pathname.replace(base, '')
      const destino = ruta && ruta !== '404.html' ? base + ruta : base
      location.replace(destino)
    </script>
  </head>
  <body>
    <a href="/fichaje/">Ir a la aplicación</a>
  </body>
</html>
